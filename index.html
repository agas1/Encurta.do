<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encurtador de URL</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="navbar">
      <nav>
        <a href="#" class="nav-link">Login</a>
        <a href="https://pt.aliexpress.com/w/wholesale-AMD-Radeon-RX-6600.html?spm=a2g0o.productlist.search.0" class="nav-link">Cadastre-se</a>
      </nav>
    </header>

    <header>
      <h1>Encurte a sua URL</h1>
    </header>

    <main>
      <div class="url-input">
        <input id="url-input" type="text" placeholder="Digite a URL a ser encurtada">
      </div>
      <div id="resultado" class="resultado-box oculto"></div>
      <div class="buttons">
        <button id="encurtar-btn" class="encurtar">Encurtar</button>
        <button id="copiar-btn" class="copiar">Copiar</button>
      </div>
    </main>

    <footer>
      <div class="mascotes">
        <img src="https://i.ibb.co/Cn1MqbN/7100-4-10.png" alt="Mascote Panda 1">
        <img src="https://i.ibb.co/dgT7MRv/7100-5-02.png" alt="Mascote Panda 2">
      </div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
